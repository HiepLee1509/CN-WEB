<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Về Nhà - Công Nghệ Web</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .card {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            font-size: 16px;
            color: #555;
        }
        li:last-child {
            border-bottom: none;
        }
        .label {
            font-weight: bold;
            color: #34495e;
        }
        .status {
            color: #27ae60;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Báo Cáo BTVN - Công Nghệ Web</h1>
        <ul>
            <li><span class="label">Tên miền:</span> <a href="http://lenghiahiep20235326.io.vn" target="_blank">lenghiahiep20235326.io.vn</a></li>
            <li><span class="label">Hosting:</span> GitHub Pages</li>
            <li><span class="label">Repository:</span> <a href="https://github.com/HiepLee1509/CN-WEB" target="_blank">HiepLee1509/CN-WEB</a></li>
            <li><span class="label">Trạng thái:</span> <span class="status">Đã hoàn thành ✅</span></li>
        </ul>
    </div>
</body>
